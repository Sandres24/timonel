name: CI

on:
  push:
    branches: ["main"]
  pull_request: 
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v4
      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - name: Usar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v4
      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - name: Usar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  check-skip:
    runs-on: ubuntu-latest

    steps:
      - name: Cancelar Ejecuciones Anteriores
        uses: styfle/cancel-workflow-action@0.13.1
